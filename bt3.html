<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    class Rectangle {
        constructor(length,width) {
            this.length=length;
            this.width=width;
        }

        getArea(){
            return this.length*this.width;
        }

        getPerimeter(){
            return (this.length+this.width)*2;
        }

        setSize(newLength, newWidth){
            this.length=newLength;
            this.width=newWidth;
        }
    }

    let rect1=new Rectangle(3,4);

    console.log(rect1.getArea());
    console.log(rect1.getPerimeter());
    rect1.setSize(8,9);
    console.log(rect1);
</script>
</body>
</html>
